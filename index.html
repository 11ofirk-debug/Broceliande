<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Broceliande — M1</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="stage">
    <canvas id="game-canvas"></canvas>

    <div id="ui-layer">
      <div id="hud">
        <div class="hud-left">
          <span class="hud-label">Druid</span>
          <div id="hud-hp-bar"><div id="hud-hp-fill"></div></div>
          <span id="hud-hp-text"></span>
          <div id="hud-resources">
            <!-- Icons are inserted from js/icons.js, shared with the drop items on the canvas. -->
            <span class="res" title="Peach Pits">
              <span class="res-icon" data-resource="pits"></span>
              <span id="res-pits">0</span>
            </span>
            <span class="res" title="Reeds">
              <span class="res-icon" data-resource="reeds"></span>
              <span id="res-reeds">0</span>
            </span>
            <span class="res" title="Feathers">
              <span class="res-icon" data-resource="feathers"></span>
              <span id="res-feathers">0</span>
            </span>
            <span class="res" title="Mossy Boughs">
              <span class="res-icon" data-resource="boughs"></span>
              <span id="res-boughs">0</span>
            </span>
          </div>
        </div>
        <div class="hud-center">
          <span id="hud-phase"></span>
          <span id="hud-timer"></span>
          <div id="hud-steps" hidden>
            <div id="hud-steps-bar"><div id="hud-steps-fill"></div><div id="hud-steps-preview"></div></div>
            <span id="hud-steps-text"></span>
          </div>
          <span id="hud-wolves"></span>
        </div>
        <div class="hud-right">
          <button id="btn-start-combat" type="button">Start Combat</button>
          <!-- Mute toggle (M1g §3.6); also the V key. -->
          <button id="btn-mute" type="button" title="Sound on (V to mute)">
            <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
              <path class="speaker" d="M3 9h4l5-4v14l-5-4H3z" />
              <path class="waves" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" />
              <path class="cross" d="M16 9l6 6M22 9l-6 6" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Current Wilds name, bottom-left (M2a §6); never blocks clicks. Before the end overlay, so
           it stays visible under it. -->
      <div id="level-name" hidden></div>

      <div id="end-overlay" hidden>
        <div class="end-panel">
          <div id="end-title"></div>
          <div id="end-stats"></div>
          <!-- M2a §4.4: what carries over (Victory, run goes on) or the closing line (run complete). -->
          <!-- M2d §2.3: what the field sweep collected on Victory (omitted if nothing). -->
          <div id="end-gathered" hidden><div class="end-carry-title">Gathered from the field:</div><div id="end-gathered-rows"></div></div>
          <div id="end-carry" hidden><div class="end-carry-title">Carried to the next Wilds:</div><div id="end-carry-rows"></div></div>
          <div id="end-message" hidden></div>
          <button id="btn-restart" type="button">Restart</button>
        </div>
      </div>


      <!-- Mini-boss (M2c §2.6–2.7): HP bar just below the HUD strip while one is alive, and the
           centred arrival banner. Neither blocks clicks. -->
      <div id="boss-bar" hidden><span id="boss-name"></span><div id="boss-bar-track"><div id="boss-bar-fill"></div></div><span id="boss-hp"></span></div>
      <div id="boss-banner" hidden></div>

      <div id="mode-banner" hidden></div>

      <div id="tooltip" hidden></div>

      <!-- Contextual menu: one .menu-option per choice, built by js/ui.js. -->
      <div id="menu" hidden><div id="menu-header" hidden></div><div id="menu-options"></div></div>

      <pre id="debug-panel" hidden></pre>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
